name: tests

# The gate, run for real. tests/run.sh drives the actual config in headless
# nvim and on real ptys, so this is the same 556 cases you get locally -- not a
# lint. It exists because "works on Linux" was a claim in the README that
# nothing checked, and on a stock Ubuntu box it was not true.
#
# Every PR, and main. NOT every push: a branch with a PR open would then run the
# whole 6-minute gate twice for one commit, once per event. A feature branch
# pushed with no PR open is the deliberate gap -- open the PR and it is covered.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # pinned to a commit, not the v4 tag: a tag is mutable, so the runner
      # could execute different checkout code with no diff in this repo
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # checkout leaves GITHUB_TOKEN in .git/config by default, and every
          # step after this one runs code from the PR branch -- including a
          # fork's. Nothing here pushes, so the token has no job to do.
          persist-credentials: false

      # NOT apt. Ubuntu's neovim is old enough that install.sh's own 0.9 gate
      # rejects it -- 22.04 ships 0.6.1 -- so the tarball, pinned, is the only
      # honest way to say which version the gate ran against. The .tar.gz
      # rather than the AppImage because the runner has no FUSE.
      - name: neovim
        run: |
          set -euo pipefail
          curl -fsSL -o nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/v0.11.0/nvim-linux-x86_64.tar.gz
          # curl -f authenticates the transport, not the artifact. Pin the
          # bytes too, so "which nvim did the gate run against" has one answer.
          echo "fe0a5bc79e64c5e4d9f844cd96157ebd3919ef1343b329e9ebc3f455924cc7d6  nvim.tar.gz" | sha256sum -c -
          sudo tar xzf nvim.tar.gz -C /opt
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      # xclip + xvfb are not optional decoration: suite_config.sh asserts the
      # REAL '+' register, and with no provider those cases fail for a reason
      # that has nothing to do with the mapping under test. A headless runner
      # needs an X server for xclip to own a selection at all.
      #
      # zsh because the timer suite runs drill.sh under bash AND zsh.
      #
      # pulseaudio-utils and libnotify-bin make the runner resemble a real
      # desktop box, but be clear about what that does NOT buy: suite_timer.sh
      # starts 25- and 10-minute timers and kills them within 0.4s, so play()
      # and notify() never run. Breaking the paplay or notify-send leg would
      # leave all 36 cases and this job green. Those chains are covered by
      # hand, not here. python3 is NOT listed: the pty
      # drivers need it and ubuntu-latest preinstalls it, so it is asserted
      # below rather than installed -- if that ever stops being true the gate
      # should say so, not quietly pull a different interpreter.
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fzf zsh xclip xvfb procps libnotify-bin pulseaudio-utils

      - name: the gate
        run: |
          command -v python3 >/dev/null || { echo "no python3 on the runner"; exit 1; }
          xvfb-run -a ./tests/run.sh

      # Not part of the gate: it drives a real editor for a screen recording and
      # is slow. --check is the cheap half, and it is what tells us demo.sh
      # still runs at all on a box with no bc.
      # NOT `demo.sh --check`. That drives a real editor and asserts on a DRAWN
      # confirmation prompt, so it needs a genuine terminal -- with stdout on a
      # pipe nvim has no screen, vim.fn.confirm() cannot draw, and the check
      # fails about the harness rather than the code. Wrapping it in `script`
      # to fake a pty just moved the failure ("the editor did not start").
      # It is a pre-recording check for a human at a terminal, not a gate.
      #
      # What CI can honestly assert about demo.sh is that it parses and that
      # its arithmetic still works without bc -- which is what this branch
      # changed and what would silently rot.
      - name: demo.sh parses, and needs no bc
        run: |
          set -euo pipefail
          bash -n demo.sh
          # Pull the REAL secs() out of demo.sh and run that. A copy of the
          # function pasted here would pass while the actual one was broken --
          # a check that cannot fail, which is worse than no check.
          real=$(sed -n '/^secs() {/p' demo.sh)
          [ -n "$real" ] || { echo "could not find secs() in demo.sh"; exit 1; }
          out=$(SPEED=0.4 bash -c "$real"'; secs 0.09')
          [ "$out" = "0.0360" ] || { echo "demo.sh secs() returned '$out', expected 0.0360"; exit 1; }
          echo "demo.sh secs() -> $out"
